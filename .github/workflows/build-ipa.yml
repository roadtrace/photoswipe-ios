name: Build SideStore IPA

on:
  workflow_dispatch:
  push:
    branches: [main, sidestore-build]
    paths:
      - 'PhotoSwipe/**'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/build-ipa.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Run duplicate matching regression checks
        run: |
          mkdir -p build
          xcrun swiftc PhotoSwipe/PhotoSwipe/Models/DuplicateSignature.swift PhotoSwipe/PhotoSwipe/Models/DuplicateScanStore.swift PhotoSwipe/PhotoSwipe/Models/DeletionSelection.swift tests/main.swift -o build/duplicate-checks
          build/duplicate-checks
      - name: Build and verify unsigned device IPA
        id: ipa
        run: bash scripts/build-ipa.sh
      - name: Upload IPA and build records
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: PhotoSwipe-SideStore
          path: ${{ steps.ipa.outputs.artifact_path }}/
          if-no-files-found: error
          retention-days: 14
      - name: Check preview, persisted scans, and review grid in iPhone Simulator
        run: bash scripts/check-ui.sh
      - name: Upload simulator evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: PhotoSwipe-UI-Checks
          path: build/ui-artifacts/
          if-no-files-found: warn
          retention-days: 14
